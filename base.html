<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayorinde Ayomade</title>

  <style>
    /* ===== COLOURS (change them here and the whole site changes) ===== */
    :root {
      --bg: #0a192f;
      --text: #ccd6f6;
      --dim: #8892b0;
      --accent: #64ffda;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ===== FLOATING BLURRED BLOBS (background glow) ===== */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      z-index: 0;
      animation: float 14s ease-in-out infinite;
      pointer-events: none;
    }
    .blob.b1 { width: 420px; height: 420px; background: #0fb9a0; top: -80px; right: -60px; }
    .blob.b2 { width: 360px; height: 360px; background: #1d4e89; bottom: 8%; left: -90px; animation-delay: -5s; }
    .blob.b3 { width: 280px; height: 280px; background: #b8662b; bottom: -60px; right: 12%; animation-delay: -9s; opacity: 0.4; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(30px, -40px); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== TOP BAR (Routel style): logo | pill menu | button ===== */
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 18px clamp(16px, 5vw, 56px);
      position: relative;
      z-index: 10;
    }

    /* Left: logo */
    .logo {
      justify-self: start;
      font-family: Consolas, monospace;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      font-size: 1.3rem;
    }

    /* Middle: glass pill that holds the links */
    .nav {
      display: flex;
      gap: 4px;
      padding: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .nav a {
      padding: 10px 20px;
      border-radius: 999px;
      color: var(--dim);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    .nav a:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
    }
    /* The page you're on: lit-up pill */
    .nav a.current {
      color: #0a192f;
      background: var(--accent);
      box-shadow: 0 4px 18px rgba(100, 255, 218, 0.35);
    }

    /* Right: button with arrow circle */
    .nav-cta {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 6px 6px 6px 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #0a192f;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .nav-cta .arrow {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(10, 25, 47, 0.15);
      transition: transform 0.25s ease;
    }
    .nav-cta:hover { box-shadow: 0 6px 22px rgba(100, 255, 218, 0.4); }
    .nav-cta:hover .arrow { transform: translateX(4px); }
    .nav-cta:active { transform: scale(0.97); }

    /* ===== PAGE CONTENT AREA ===== */
    main {
      position: relative;
      z-index: 5;
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px clamp(16px, 5vw, 56px) 60px;
      animation: fadeUp 0.7s ease both;
    }

    /* ===== HOME PAGE HERO ===== */
    .hero { padding-top: clamp(20px, 6vh, 70px); }
    .hello {
      font-family: Consolas, monospace;
      color: var(--accent);
      margin-bottom: 14px;
    }
    .hero h1 {
      font-size: clamp(2.2rem, 7vw, 4.2rem);
      line-height: 1.1;
      color: #e6f1ff;
    }
    .hero h1 span { color: var(--dim); }
    .intro {
      max-width: 560px;
      margin-top: 22px;
      color: var(--dim);
      font-size: 1.1rem;
      line-height: 1.7;
    }

    /* Row that holds the two hero buttons (the gap fix) */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    .btn-row .button { margin: 0; }

    /* Skill tags */
    .tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
    .tag {
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      font-size: 0.95rem;
    }

    /* ===== GLASS CARDS ===== */
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px;
      padding: 28px;
      margin-bottom: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: fadeUp 0.7s ease both;
    }

    /* ===== BUTTONS (hover + click feedback) ===== */
    /* ===== SOCIAL ICONS ===== */
    .social-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--dim);
      transition: all 0.3s ease;
      margin-left: 8px;
    }
    
    .social-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(100, 255, 218, 0.15);
    }
    .button {
      display: inline-block;
      padding: 14px 30px;
      border-radius: 999px;
      border: 1px solid var(--accent);
      background: rgba(100, 255, 218, 0.1);
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    .button:hover {
      background: rgba(100, 255, 218, 0.22);
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(100, 255, 218, 0.25);
    }
    .button:active, .button:focus {
      background: rgba(100, 255, 218, 0.38);
      transform: scale(0.97);
      outline: none;
    }

    /* ===== FOOTER ===== */
    footer {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 30px 16px;
      color: var(--dim);
      font-size: 0.9rem;
    }

    /* ===== PHONES ===== */
    @media (max-width: 800px) {
      .topbar {
        grid-template-columns: 1fr auto;
        row-gap: 14px;
      }
      .nav {
        grid-column: 1 / -1;
        grid-row: 2;
        justify-self: stretch;
        overflow-x: auto;
      }
      .nav a { padding: 9px 16px; white-space: nowrap; }
      .nav-cta { padding-left: 18px; }
    }
  </style>
</head>

<body>
  <!-- Background glow -->
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <!-- TOP BAR -->
  <header class="topbar">
    <a class="logo" href="/">YILLZ</a>

    <nav class="nav">
      <a href="/" class="{{ 'current' if request.path == '/' else '' }}">Home</a>
      <a href="/about" class="{{ 'current' if request.path == '/about' else '' }}">About</a>
      <a href="/projects" class="{{ 'current' if request.path == '/projects' else '' }}">Projects</a>
      <a href="/contact" class="{{ 'current' if request.path == '/contact' else '' }}">Contact</a>
      <a href="/goal" class="{{ 'current' if request.path == '/goal' else '' }}">Goal</a>
    </nav>

    <a class="nav-cta" href="/contact">Hire me <span class="arrow">→</span></a>
  </header>

  <!-- Each page's own content goes here -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>© 2026 Yillz. Built with Python and Flask.</footer>
</body>
</html>
